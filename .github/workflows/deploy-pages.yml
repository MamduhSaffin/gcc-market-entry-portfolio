name: Deploy eRomman Seller Guide to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /sell-to-the-middle-east
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add company profile and seller success videos to the seller guide
        run: node scripts/inject-video-sections.mjs

      - name: Build static export
        run: pnpm build

      - name: Validate routes and fingerprint this release
        run: node scripts/verify-pages.mjs stamp ./out "$GITHUB_SHA" "$NEXT_PUBLIC_BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout verification script
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm the release at the public URL
        timeout-minutes: 15
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-pages.mjs live "$PAGES_URL" "$GITHUB_SHA"
